---
- name: Post-Check Patch Verification - Windows
  hosts: jp_windows
  gather_facts: false
  vars:
    # Target KBs passed to or defined for this playbook
    target_kb_ids:
      - "KB4055223"
      - "KB2267602"

  tasks:
    # -------------------------------------------------------------------------
    # 1. RESCAN WINDOWS UPDATE AGENT AFTER PATCHING / REBOOT
    # -------------------------------------------------------------------------
    - name: Rescan Windows Update Agent for remaining needed updates
      ansible.windows.win_updates:
        state: searched
      register: post_patch_scan

    # -------------------------------------------------------------------------
    # 2. VERIFY TARGET KBs ARE RESOLVED (INSTALLED OR SUPERSEDED)
    # -------------------------------------------------------------------------
    - name: Verify Targeted KBs are resolved (Installed or Superseded)
      ansible.windows.win_shell: |
        $targetId = "{{ item }}".ToUpper().Replace("KB", "")
        $stillMissing = @({{ (post_patch_scan.updates.values() | selectattr('kb', 'defined') | map(attribute='kb') | map('regex_replace', '^', "'") | map('regex_replace', '$', "'") | join(',')) or "''" }})
        
        $installed = Get-HotFix | Where-Object { $_.HotFixID -match $targetId }
        $isMissing = $stillMissing -contains $targetId

        # Resolved if IT IS INSTALLED or NO LONGER FLAGGED AS NEEDED (Superseded)
        if ($installed -or (-not $isMissing)) { exit 0 } else { exit 1 }
      loop: "{{ target_kb_ids }}"
      register: post_check_results
      failed_when: false
      changed_when: false

    # -------------------------------------------------------------------------
    # 3. EVALUATE FINAL VERIFICATION RESULTS
    # -------------------------------------------------------------------------
    - name: Calculate unresolved KBs
      ansible.builtin.set_fact:
        unresolved_kbs: "{{ post_check_results.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

    - name: Display Post-Patching Status Summary
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          status: "{{ 'Patches resolved' if (unresolved_kbs | length == 0) else 'Patches unresolved' }}"
          unresolved_list: "{{ unresolved_kbs }}"

    # -------------------------------------------------------------------------
    # 4. FAIL PLAYBOOK IF PATCHES ARE STILL UNRESOLVED
    # -------------------------------------------------------------------------
    - name: Assert all targeted KBs are resolved
      ansible.builtin.assert:
        that:
          - unresolved_kbs | length == 0
        fail_msg: "Post-check failed: The following KBs are still unresolved: {{ unresolved_kbs | join(', ') }}"
        success_msg: "Patches resolved: All target KBs are installed or superseded."