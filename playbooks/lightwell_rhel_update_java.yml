---
- name: Download and Install Java Package via Maven from Red Hat Lightwell Repo
  hosts: jp_lightwell_rhel
  become: true
  vars:
    # Target package details
    group_id: "org.json"
    artifact_id: "json"
    artifact_version: "20220320.0.0.rhlw-00003"
    
    # Lightwell Maven Repository details
    repo_id: "lightwell-validated-java"
    repo_url: "https://packages.redhat.com/api/pulp-content/public-lightwell-demo/java/validated/"

  tasks:
    - name: Ensure invalid YUM/DNF Lightwell repo file is removed (if previously added)
      ansible.builtin.file:
        path: "/etc/yum.repos.d/lightwell_repo.repo"
        state: absent

    - name: Install Maven on RHEL
      ansible.builtin.dnf:
        name: maven
        state: present
        disablerepo: "lightwell_repo"  # Prevents DNF from attempting to treat the Maven URL as an RPM repo
      ignore_errors: true

    - name: Ensure Maven configuration directory exists
      ansible.builtin.file:
        path: "/root/.m2"
        state: directory
        mode: '0755'

    - name: Configure Maven settings.xml with Lightwell repository profile
      ansible.builtin.copy:
        dest: "/root/.m2/settings.xml"
        mode: '0644'
        content: |
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>lightwell-repo-profile</id>
                <repositories>
                  <repository>
                    <id>{{ repo_id }}</id>
                    <name>Lightwell Validated Java Repo</name>
                    <url>{{ repo_url }}</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>lightwell-repo-profile</activeProfile>
            </activeProfiles>
          </settings>

    - name: Download and install artifact into local Maven repository using CLI
      ansible.builtin.command: >
        mvn dependency:get
        -DremoteRepositories={{ repo_id }}::default::{{ repo_url }}
        -Dartifact={{ group_id }}:{{ artifact_id }}:{{ artifact_version }}
      register: mvn_output
      changed_when: "'Downloading' in mvn_output.stdout or 'Downloaded' in mvn_output.stdout"

    - name: Verify downloaded JAR exists in local Maven cache
      ansible.builtin.stat:
        path: "/root/.m2/repository/{{ group_id | replace('.', '/') }}/{{ artifact_id }}/{{ artifact_version }}/{{ artifact_id }}-{{ artifact_version }}.jar"
      register: jar_cache_stat

    - name: Confirm successful Maven installation
      ansible.builtin.assert:
        that:
          - jar_cache_stat.stat.exists
          - jar_cache_stat.stat.size > 0
        fail_msg: "Verification Failed: Artifact was not installed into local Maven cache."
        success_msg: "Successfully downloaded and installed {{ group_id }}:{{ artifact_id }}:{{ artifact_version }} via Maven from Lightwell Repo!"