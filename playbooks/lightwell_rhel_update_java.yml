---
- name: Download Red Hat Lightwell org.json JAR
  hosts: jp_lightwell_rhel
  become: true
  vars:
    maven_base_url: "https://packages.redhat.com/api/pulp-content/public-lightwell-demo/java/validated"
    group_path: "org/json"
    artifact_id: "json"
    artifact_version: "20220320.0.0.rhlw-00003"
    target_jar_path: "/usr/share/java/{{ artifact_id }}-{{ artifact_version }}.jar"
    artifact_url_path: "{{ maven_base_url }}/{{ group_path }}/{{ artifact_id }}/{{ artifact_version }}/{{ artifact_id }}-{{ artifact_version }.jar"

  tasks:
    - name: Ensure target directory exists
      ansible.builtin.file:
        path: "/usr/share/java"
        state: directory
        mode: '0755'

    - name: Download org.json Lightwell rebuilt JAR file
      ansible.builtin.get_url:
        url: "{{ artifact_url_path }}"
        dest: "{{ target_jar_path }}"
        mode: '0644'
      register: jar_download

    - name: Verify downloaded file exists and is non-empty
      ansible.builtin.stat:
        path: "{{ target_jar_path }}"
        checksum_algorithm: sha256
      register: jar_stat

    - name: Fail if JAR file was not created or is empty
      ansible.builtin.assert:
        that:
          - jar_stat.stat.exists
          - jar_stat.stat.size > 0
        fail_msg: "Verification Failed: The JAR file was not downloaded correctly or is empty."
        success_msg: "Verification Passed: JAR file exists with size {{ jar_stat.stat.size }} bytes."

    - name: Read internal MANIFEST.MF metadata from JAR
      ansible.builtin.command:
        cmd: "unzip -p {{ target_jar_path }} META-INF/MANIFEST.MF"
      register: manifest_output
      changed_when: false
      failed_when: false

    - name: Confirm artifact contains Lightwell / Red Hat build signature
      ansible.builtin.assert:
        that:
          - "'rhlw' in manifest_output.stdout or 'Red Hat' in manifest_output.stdout or artifact_version in manifest_output.stdout"
        fail_msg: "Verification Warning: MANIFEST.MF does not contain expected Lightwell/Red Hat release identifiers."
        success_msg: "Verification Passed: MANIFEST.MF confirms Lightwell release artifact."
      when: manifest_output.rc == 0

    - name: Optional - Attempt to fetch SHA1 or MD5 checksum if available
      ansible.builtin.uri:
        url: "{{ artifact_url_path }}.sha1"
        return_content: true
        status_code: [200, 404]
      register: remote_sha1

    - name: Display SHA1 Verification Status
      ansible.builtin.debug:
        msg: "Remote SHA1: {{ remote_sha1.content | trim if remote_sha1.status == 200 else 'Checksum sidecar file not hosted on repo endpoint' }}"