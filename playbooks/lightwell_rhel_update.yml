---
- name: Download, Install, and Verify Jinja2 Package
  hosts: jp_lightwell_rhel
  connection: local
  gather_facts: false

  vars:
    package_url: "https://packages.redhat.com/api/pulp-content/public-lightwell-demo/python/validated/jinja2-3.1.6-0-py3-none-any.whl"
    download_path: "/tmp/jinja2-3.1.6-0-py3-none-any.whl"

  tasks:
    - name: Download the Jinja2 wheel package
      ansible.builtin.get_url:
        url: "{{ package_url }}"
        dest: "{{ download_path }}"
        mode: '0644'

    - name: Install Jinja2 from the downloaded wheel package
      ansible.builtin.pip:
        name: "{{ package_url }}"
        state: present
        extra_args: "--force-reinstall --no-cache-dir"

    - name: Locate the installed package metadata directory
      ansible.builtin.find:
        paths:
          - "/usr/local/lib"
          - "/usr/lib"
        patterns: "jinja2-*.dist-info"
        file_type: directory
        recurse: true
      register: found_dist_info

    - name: Read PEP 610 direct_url.json metadata
      ansible.builtin.slurp:
        src: "{{ found_dist_info.files[0].path }}/direct_url.json"
      register: direct_url_content

    - name: Parse and Display Download Source URL
      vars:
        origin_data: "{{ direct_url_content.content | b64decode | from_json }}"
      ansible.builtin.debug:
        msg:
          - "================================================="
          - "Package Name: jinja2"
          - "Installed Source URL: {{ origin_data.url }}"
          - "================================================="