---
- name: Download, Install, and Verify LightWell Jinja2 Package
  hosts: jp_lightwell_rhel
  gather_facts: false

  vars:
    package_url: "https://packages.redhat.com/api/pulp-content/public-lightwell-demo/python/validated/jinja2-3.1.6-0-py3-none-any.whl"

  tasks:
    - name: Force install Jinja2 directly from remote URL
      ansible.builtin.pip:
        name: "{{ package_url }}"
        state: present
        extra_args: "--force-reinstall --no-cache-dir"

    - name: Get active Python site-packages path
      ansible.builtin.command:
        cmd: python3 -c "import site; print(site.getsitepackages()[0] if hasattr(site, 'getsitepackages') else site.get_usersitepackages())"
      register: python_site_packages
      changed_when: false

    - name: Find direct_url.json file
      ansible.builtin.find:
        paths: 
          - "{{ python_site_packages.stdout }}"
          - "~/.local/lib"
          - "/usr/local/lib"
        patterns: "direct_url.json"
        contains: ".*public-lightwell-demo.*"
        file_type: file
        recurse: true
      register: found_json

    - name: Read direct_url.json if present
      ansible.builtin.slurp:
        src: "{{ found_json.files[0].path }}"
      register: direct_url_content
      when: found_json.matched > 0

    - name: Display Download Source URL
      vars:
        origin_data: "{{ (direct_url_content.content | b64decode | from_json) if (found_json.matched > 0) else {} }}"
      ansible.builtin.debug:
        msg:
          - "================================================="
          - "Package Name: jinja2"
          - "Installed Source URL: {{ origin_data.url | default('direct_url.json not generated by pip for this build') }}"
          - "================================================="